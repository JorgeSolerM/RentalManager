{% extends "layouts/base.html" %}{% block title %}Características · Configuración{% endblock %}{% block content %}
{% include "components/settings_nav.html" %}<section class="card"><div class="card-body"><h1 class="h4">Características</h1>
<form method="post" action="/settings/features/create" class="row g-2 align-items-end mb-4"><div class="col-md-2"><label class="form-label">Nombre</label><input class="form-control" name="name" required></div><div class="col-md-2"><label class="form-label">Slug</label><input class="form-control" name="slug" required></div><div class="col-md-2"><label class="form-label">Ámbito</label><select class="form-select" name="scope"><option value="property">Property</option><option value="room">Room</option><option value="both">Ambos</option></select></div><div class="col-md-2"><label class="form-label">Categoría</label><input class="form-control" name="category" required></div><div class="col-md-1"><label class="form-label">Orden</label><input class="form-control" type="number" min="0" name="display_order" value="0"></div><div class="col-md-1"><label class="form-label">Icono</label><input class="form-control" name="icon_key"></div><div class="col-md-1 form-check"><input class="form-check-input" type="checkbox" name="active" checked><label>Activa</label></div><div class="col-md-1"><button class="btn btn-primary">Crear</button></div></form>
{% for feature in features %}<form method="post" action="/settings/features/update/{{ feature.id }}" class="row g-2 align-items-center mb-2"><div class="col-md-2"><input class="form-control form-control-sm" name="name" value="{{ feature.name }}" required></div><div class="col-md-2"><input class="form-control form-control-sm" name="slug" value="{{ feature.slug }}" required></div><div class="col-md-2"><select class="form-select form-select-sm" name="scope">{% for value,label in [('property','Property'),('room','Room'),('both','Ambos')] %}<option value="{{ value }}" {% if feature.scope == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="col-md-2"><input class="form-control form-control-sm" name="category" value="{{ feature.category }}" required></div><div class="col-md-1"><input class="form-control form-control-sm" type="number" name="display_order" value="{{ feature.display_order }}"></div><div class="col-md-1"><input class="form-control form-control-sm" name="icon_key" value="{{ feature.icon_key or '' }}"></div><div class="col-md-1 form-check"><input class="form-check-input" type="checkbox" name="active" {% if feature.active %}checked{% endif %}><label>Activa</label></div><div class="col-md-1 d-flex gap-1"><button class="btn btn-sm btn-outline-primary">Guardar</button><button class="btn btn-sm btn-outline-danger" formaction="/settings/features/delete/{{ feature.id }}">🗑</button></div></form>{% endfor %}</div></section>{% endblock %}
