{% extends "layouts/base.html" %}{% block title %}Gestores · Configuración{% endblock %}{% block content %}{% include "components/settings_nav.html" %}<section class="card"><div class="card-body"><h1 class="h4">Gestores</h1>
<form method="post" action="/settings/managers/create" class="row g-2 align-items-end mb-4"><div class="col-md-4"><label class="form-label">Nombre</label><input class="form-control" name="name" required></div><div class="col-md-3"><label class="form-label">Teléfono público</label><input class="form-control" name="phone" type="tel" placeholder="+34 600 123 123"></div><div class="col-md-2 form-check"><input class="form-check-input" type="checkbox" name="active" checked><label>Activo</label></div><div class="col-md-3"><button class="btn btn-primary">Crear gestor</button></div></form>
{% for manager in managers %}<article class="border rounded p-3 mb-3"><div class="row g-3 align-items-center"><div class="col-auto">{% if manager.photo %}<img class="rounded-circle object-fit-cover" src="/media-assets/{{ manager.photo.id }}/variants/320" alt="" width="64" height="64">{% else %}<div class="rounded-circle bg-secondary-subtle d-flex align-items-center justify-content-center fw-semibold" style="width:64px;height:64px">{{ manager.name[:1]|upper }}</div>{% endif %}</div><div class="col"><form method="post" action="/settings/managers/update/{{ manager.id }}" class="row g-2"><div class="col-md-4"><label class="form-label">Nombre</label><input class="form-control" name="name" value="{{ manager.name }}" required></div><div class="col-md-3"><label class="form-label">Teléfono público</label><input class="form-control" name="phone" type="tel" value="{{ manager.phone or '' }}" placeholder="+34 600 123 123"></div><div class="col-md-2 form-check"><input class="form-check-input" type="checkbox" name="active" {% if manager.active %}checked{% endif %}><label>Activo</label></div><div class="col-md-3 align-self-end"><button class="btn btn-outline-primary">Guardar</button></div></form><form method="post" enctype="multipart/form-data" action="/settings/managers/{{ manager.id }}/photo" class="d-flex gap-2 mt-2"><input class="form-control form-control-sm" type="file" name="file" accept="image/jpeg,image/png,image/webp" required><button class="btn btn-sm btn-outline-secondary">Actualizar foto</button></form><form method="post" action="/settings/managers/{{ manager.id }}/assign-unassigned" class="mt-2"><button class="btn btn-sm btn-outline-secondary" {% if not manager.active %}disabled{% endif %}>Asignar a todos los inmuebles sin gestor</button></form></div></div></article>{% endfor %}
</div></section>{% endblock %}
