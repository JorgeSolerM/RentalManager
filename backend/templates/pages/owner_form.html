{% extends "layouts/base.html" %}
{% block title %}{{ 'Editar propietario' if owner else 'Nuevo propietario' }} · RentalManager{% endblock %}
{% block content %}
<div class="mb-3"><a href="{{ '/owners/' ~ owner.id if owner else '/owners' }}">← Volver</a><h1 class="h3 mt-2">{{ 'Editar propietario' if owner else 'Nuevo propietario' }}</h1></div>
<form class="card card-body" method="post" action="{{ '/owners/' ~ owner.id ~ '/update' if owner else '/owners/create' }}">
<fieldset><legend class="h5">Identificación</legend><div class="row g-3">
<div class="col-md-6"><label class="form-label" for="legalName">Nombre legal *</label><input class="form-control" id="legalName" name="legal_name" required value="{{ owner.legal_name if owner else '' }}"></div>
<div class="col-md-6"><label class="form-label" for="displayName">Nombre visible</label><input class="form-control" id="displayName" name="display_name" value="{{ owner.display_name or '' if owner else '' }}"></div>
<div class="col-md-4"><label class="form-label" for="taxId">NIF/CIF</label><input class="form-control" id="taxId" name="tax_id" value="{{ owner.tax_id or '' if owner else '' }}"></div>
</div></fieldset>
<fieldset class="mt-4"><legend class="h5">Contacto</legend><div class="row g-3"><div class="col-md-6"><label class="form-label" for="email">Email</label><input class="form-control" type="email" id="email" name="email" value="{{ owner.email or '' if owner else '' }}"></div><div class="col-md-6"><label class="form-label" for="phone">Teléfono</label><input class="form-control" id="phone" name="phone" value="{{ owner.phone or '' if owner else '' }}"></div></div></fieldset>
<fieldset class="mt-4"><legend class="h5">Domicilio</legend><div class="row g-3"><div class="col-12"><label class="form-label" for="address">Dirección</label><input class="form-control" id="address" name="address_line" value="{{ owner.address_line or '' if owner else '' }}"></div><div class="col-md-3"><label class="form-label" for="postalCode">Código postal</label><input class="form-control" id="postalCode" name="postal_code" value="{{ owner.postal_code or '' if owner else '' }}"></div><div class="col-md-3"><label class="form-label" for="city">Localidad</label><input class="form-control" id="city" name="city" value="{{ owner.city or '' if owner else '' }}"></div><div class="col-md-3"><label class="form-label" for="province">Provincia</label><input class="form-control" id="province" name="province" value="{{ owner.province or '' if owner else '' }}"></div><div class="col-md-3"><label class="form-label" for="country">País</label><input class="form-control text-uppercase" maxlength="2" id="country" name="country" value="{{ owner.country or '' if owner else '' }}" placeholder="ES"></div></div></fieldset>
<div class="mt-4"><label class="form-label" for="notes">Observaciones</label><textarea class="form-control" id="notes" name="notes" rows="3">{{ owner.notes or '' if owner else '' }}</textarea></div>
<div class="form-check mt-3"><input class="form-check-input" type="checkbox" id="active" name="active"{% if not owner or owner.active %} checked{% endif %}><label class="form-check-label" for="active">Activo</label></div>
<div class="mt-4 d-flex gap-2"><button class="btn btn-primary">Guardar</button><a class="btn btn-outline-secondary" href="{{ '/owners/' ~ owner.id if owner else '/owners' }}">Cancelar</a></div>
</form>{% endblock %}
