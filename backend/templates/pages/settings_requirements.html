{% extends "layouts/base.html" %}{% block title %}Requisitos · Configuración{% endblock %}{% block content %}
{% include "components/settings_nav.html" %}<section class="card"><div class="card-body"><h1 class="h4">Requisitos</h1>
<form method="post" action="/settings/requirements/create" class="row g-2 align-items-end mb-4"><div class="col-md-3"><label class="form-label">Nombre público</label><input class="form-control" name="public_name" required></div><div class="col-md-2"><label class="form-label">Slug</label><input class="form-control" name="slug" required></div><div class="col-md-4"><label class="form-label">Descripción pública</label><input class="form-control" name="public_description"></div><div class="col-md-1"><label class="form-label">Orden</label><input class="form-control" type="number" min="0" name="display_order" value="0"></div><div class="col-md-1 form-check"><input class="form-check-input" type="checkbox" name="active" checked><label>Activo</label></div><div class="col-md-1"><button class="btn btn-primary">Crear</button></div></form>
{% for requirement in requirements %}<form method="post" action="/settings/requirements/update/{{ requirement.id }}" class="row g-2 align-items-center mb-2"><div class="col-md-3"><input class="form-control form-control-sm" name="public_name" value="{{ requirement.public_name }}" required></div><div class="col-md-2"><input class="form-control form-control-sm" name="slug" value="{{ requirement.slug }}" required></div><div class="col-md-4"><input class="form-control form-control-sm" name="public_description" value="{{ requirement.public_description or '' }}"></div><div class="col-md-1"><input class="form-control form-control-sm" type="number" min="0" name="display_order" value="{{ requirement.display_order }}"></div><div class="col-md-1 form-check"><input class="form-check-input" type="checkbox" name="active"{% if requirement.active %} checked{% endif %}><label>Activo</label></div><div class="col-md-1 d-flex gap-1"><button class="btn btn-sm btn-outline-primary">Guardar</button><button class="btn btn-sm btn-outline-danger" formaction="/settings/requirements/delete/{{ requirement.id }}" title="Eliminar requisito">🗑</button></div></form>{% endfor %}</div></section>{% endblock %}
