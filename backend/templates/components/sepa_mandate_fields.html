<div class="col-md-6"><label class="form-label">Perfil acreedor *</label><select class="form-select" name="creditor_profile_id" required>{% if not mandate %}<option value="">Selecciona un acreedor</option>{% endif %}{% for profile in sepa_profiles %}<option value="{{ profile.id }}"{% if mandate and mandate.creditor_profile_id == profile.id %} selected{% endif %}>{{ profile.display_name }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Referencia del mandato *</label><div class="input-group"><input aria-label="Referencia del mandato" class="form-control font-monospace" name="mandate_reference" maxlength="35" required value="{{ mandate.mandate_reference if mandate else '' }}"{% if mandate and mandate.status != 'draft' %} readonly{% endif %}>{% if not mandate or mandate.status == 'draft' %}<button type="button" class="btn btn-outline-primary" data-generate-reference>Generar referencia</button>{% endif %}</div><small class="text-muted" role="status" data-reference-status></small></div>
<div class="col-md-6"><label class="form-label">Nombre del deudor *</label><input class="form-control" name="debtor_name" required value="{{ mandate.debtor_name if mandate else (person.display_name or person.full_name) }}"></div>
<div class="col-md-6"><label class="form-label">IBAN del deudor *</label><input class="form-control font-monospace" name="debtor_iban" autocomplete="off" required value="{{ mandate.formatted_iban if mandate else person.formatted_iban }}"></div>
<div class="col-md-4"><label class="form-label">BIC</label><input class="form-control text-uppercase" name="debtor_bic" maxlength="11" value="{{ mandate.debtor_bic or '' if mandate else '' }}"></div>
<div class="col-md-4"><label class="form-label">Fecha de firma *</label><input class="form-control" type="date" name="signature_date" required value="{{ mandate.signature_date.isoformat() if mandate else '' }}"></div>
<div class="col-md-2"><label class="form-label">Tipo</label><select class="form-select" name="mandate_type">{% for value in ['RCUR','OOFF'] %}<option value="{{ value }}"{% if mandate and mandate.mandate_type == value %} selected{% endif %}>{{ value }}</option>{% endfor %}</select></div>
<div class="col-md-2"><label class="form-label">Estado</label><select class="form-select" name="status">{% for value,label in [('draft','Borrador'),('active','Activo'),('cancelled','Cancelado'),('expired','Expirado')] %}<option value="{{ value }}"{% if mandate and mandate.status == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
<div class="col-md-4"><label class="form-label">Vigente desde</label><input class="form-control" type="date" name="active_from" value="{{ mandate.active_from.isoformat() if mandate and mandate.active_from else '' }}"></div>
<div class="col-md-4"><label class="form-label">Cancelado el</label><input class="form-control" type="date" name="cancelled_at" value="{{ mandate.cancelled_at.isoformat() if mandate and mandate.cancelled_at else '' }}"></div>
<div class="col-md-4 d-flex align-items-end"><div class="form-check mb-2"><input class="form-check-input" type="checkbox" name="amendment_indicator" id="mandateAmendment{{ mandate.id if mandate else 'New' }}"{% if mandate and mandate.amendment_indicator %} checked{% endif %}><label class="form-check-label" for="mandateAmendment{{ mandate.id if mandate else 'New' }}">Mandato modificado</label></div></div>
<div class="col-12"><label class="form-label">Observaciones</label><textarea class="form-control" name="notes" rows="2">{{ mandate.notes or '' if mandate else '' }}</textarea></div>
<div class="col-12"><button class="btn btn-primary">Guardar mandato</button></div>
