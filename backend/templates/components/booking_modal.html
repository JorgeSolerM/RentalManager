<div class="modal fade" id="bookingModal" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog">

        <form id="bookingForm" class="modal-content" method="post" action="/bookings/create" novalidate>

            <input type="hidden" id="bookingRoomId" name="room_id" value="{{ room.id if room is defined else '' }}">

            <div class="modal-header">

                <h5 class="modal-title" id="bookingModalTitle">
                    Nueva reserva
                </h5>

                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

            </div>

            <div class="modal-body">

                <div class="alert alert-info d-none" id="bookingImportedNotice" role="status">
                    Reserva importada: únicamente pueden modificarse el huésped y las fechas previstas.
                </div>

                <div class="mb-3">

                    <label for="bookingGuestName" class="form-label">
                        Huésped
                    </label>

                    <input type="text" class="form-control" id="bookingGuestName" name="guest_name" required autofocus>

                </div>

                <div class="row">

                    <div class="col">

                        <label for="bookingCheckIn" class="form-label">
                            Entrada
                        </label>

                        <input type="date" class="form-control" id="bookingCheckIn" name="check_in" required>

                    </div>

                    <div class="col">

                        <label for="bookingCheckOut" class="form-label">
                            Salida
                        </label>

                        <input type="date" class="form-control" id="bookingCheckOut" name="check_out" required>

                    </div>

                </div>

                <fieldset class="mt-3 border rounded p-3">

                    <legend class="float-none w-auto px-1 fs-6 mb-2">
                        Llegada y salida previstas
                    </legend>

                    <div class="row">

                        <div class="col">

                            <label for="bookingExpectedArrivalDate" class="form-label">
                                Llegada prevista
                            </label>

                            <input type="date" class="form-control" id="bookingExpectedArrivalDate" name="expected_arrival_date">

                        </div>

                        <div class="col">

                            <label for="bookingExpectedDepartureDate" class="form-label">
                                Salida prevista
                            </label>

                            <input type="date" class="form-control" id="bookingExpectedDepartureDate" name="expected_departure_date">

                        </div>

                    </div>

                    <p class="form-text mb-0 mt-2">
                        Si se dejan vacías, se utilizarán las fechas de la reserva.
                    </p>

                </fieldset>

                <div class="mt-3">

                    <label for="bookingPrice" class="form-label">
                        Precio
                    </label>

                    <input type="number" step="0.01" class="form-control" id="bookingPrice" name="price">

                </div>

                <div class="mt-3">

                    <label for="bookingNotes" class="form-label">
                        Notas
                    </label>

                    <textarea class="form-control" id="bookingNotes" rows="3" name="notes"></textarea>

                </div>

            </div>

            <div class="modal-footer">

                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancelar
                </button>

                <button type="submit" class="btn btn-primary" id="bookingSubmitButton">
                    Guardar
                </button>

                <button type="button" class="btn btn-danger d-none" id="bookingDeleteButton">
                    Eliminar
                </button>

            </div>

        </form>

    </div>

</div>
