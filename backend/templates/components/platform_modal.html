<div id="platform-modal" class="rm-modal hidden">

    <div class="rm-modal-content">

        <div class="rm-modal-header">

            <h2 id="platform-modal-title">

                Nueva plataforma

            </h2>

        </div>

        <form id="platform-form" action="/settings/platforms/create" method="post">

            <div class="form-group">

                <label for="platform-name">

                    Nombre *

                </label>

                <input id="platform-name" name="name" type="text" required>

            </div>

            <div class="form-group">

                <label for="platform-slug">

                    Slug *

                </label>

                <input id="platform-slug" name="slug" type="text" required>

            </div>

            <div class="form-group">

                <label>

                    <input id="platform-import" name="supports_import" type="checkbox">

                    Soporta importación iCal

                </label>

            </div>

            <div class="form-group">

                <label>

                    <input id="platform-export" name="supports_export" type="checkbox">

                    Soporta exportación iCal

                </label>

            </div>

            <div class="rm-modal-actions">

                <button type="button" class="btn-secondary" onclick="closePlatformModal()">

                    Cancelar

                </button>

                <button id="platform-delete-button" type="button" class="btn-danger hidden">

                    Eliminar

                </button>

                <button id="platform-submit-button" type="submit" class="btn-primary">

                    Guardar

                </button>

            </div>

        </form>

    </div>

</div>
