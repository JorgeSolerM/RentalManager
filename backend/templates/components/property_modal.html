<div id="property-modal" class="rm-modal hidden">

    <div class="rm-modal-content property-modal-content">

        <div class="rm-modal-header">

            <h2 id="property-modal-title">
                Nueva propiedad
            </h2>

        </div>

        <form id="property-form" action="/properties/create" method="post">

            <div class="property-form-grid">

            <div class="form-group">

                <label for="name">
                    Nombre *
                </label>

                <input type="text" id="name" name="name" required>

            </div>

            <div class="form-group">

                <label for="alias">
                    Alias
                </label>

                <input type="text" id="alias" name="alias">

            </div>

            <div class="form-group">

                <label for="street">
                    Calle *
                </label>

                <input type="text" id="street" name="street" required>

            </div>

            <div class="form-group">

                <label for="street_number">Número</label>

                <input type="text" id="street_number" name="street_number">

            </div>

            <div class="form-group">

                <label for="floor">Planta</label>

                <input type="text" id="floor" name="floor">

            </div>

            <div class="form-group">

                <label for="door">Puerta</label>

                <input type="text" id="door" name="door">

            </div>

            <div id="property-legacy-address" class="property-legacy-address hidden" aria-live="polite">
                <strong>Dirección anterior:</strong>
                <span id="property-legacy-address-value"></span>
                <small>Completa los campos estructurados para sustituirla al guardar.</small>
            </div>

            <div class="form-group">

                <label for="city">
                    Ciudad *
                </label>

                <input type="text" id="city" name="city" required>

            </div>

            <div class="form-group property-form-notes">

                <label for="notes">
                    Observaciones
                </label>

                <textarea id="notes" name="notes" rows="4"></textarea>

            </div>

            </div>

            <div class="rm-modal-actions">

                <button type="button" class="btn-secondary" onclick="closePropertyModal()">

                    Cancelar

                </button>

                <button id="property-delete-button" type="button" class="btn-danger hidden" onclick="deleteProperty()">

                    Eliminar

                </button>

                <button id="property-modal-submit" type="submit" class="btn-primary">

                    Guardar

                </button>

            </div>

        </form>

    </div>

</div>
