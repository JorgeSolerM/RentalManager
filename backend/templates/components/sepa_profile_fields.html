<div class="col-md-6"><label class="form-label">Nombre interno *</label><input class="form-control" name="display_name" required value="{{ profile.display_name if profile else '' }}"></div>
<div class="col-md-6"><label class="form-label">Nombre del acreedor *</label><input class="form-control" name="creditor_name" required value="{{ profile.creditor_name if profile else owner.legal_name }}"></div>
<div class="col-md-6"><label class="form-label">Identificador de acreedor SEPA *</label><input class="form-control font-monospace" name="creditor_identifier" required maxlength="35" autocomplete="off" value="{{ profile.creditor_identifier if profile else '' }}"></div>
<div class="col-md-6"><label class="form-label">Cuenta receptora *</label><select class="form-select" name="bank_account_id" required><option value="">Selecciona una cuenta</option>{% for account in owner.bank_accounts if account.active and account.receives_rent %}<option value="{{ account.id }}"{% if profile and profile.bank_account_id == account.id %} selected{% endif %}>{{ account.alias or account.masked_iban }}</option>{% endfor %}</select></div>
<div class="col-md-3"><label class="form-label">Esquema</label><select class="form-select" name="scheme"><option value="CORE" selected>CORE</option></select></div>
<div class="col-12"><label class="form-label">Observaciones</label><textarea class="form-control" name="notes" rows="2">{{ profile.notes or '' if profile else '' }}</textarea></div>
<div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" name="active" id="profileActive{{ profile.id if profile else 'New' }}"{% if not profile or profile.active %} checked{% endif %}><label class="form-check-label" for="profileActive{{ profile.id if profile else 'New' }}">Activo</label></div></div>
<div class="col-12"><button class="btn btn-primary">Guardar perfil</button></div>
