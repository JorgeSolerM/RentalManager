<div class="row g-3"><div class="col-md-6"><label class="form-label">Titular *</label><input class="form-control" name="account_holder_name" required value="{{ account.account_holder_name if account else owner.legal_name }}"></div><div class="col-md-6"><label class="form-label">Alias</label><input class="form-control" name="alias" value="{{ account.alias or '' if account else '' }}"></div><div class="col-12"><label class="form-label">IBAN *</label><input class="form-control font-monospace" name="iban" required autocomplete="off" value="{{ account.formatted_iban if account else '' }}"></div><div class="col-md-6"><label class="form-label">BIC</label><input class="form-control text-uppercase" name="bic" maxlength="11" value="{{ account.bic or '' if account else '' }}"></div><div class="col-12 d-flex flex-wrap gap-3"><div class="form-check"><input class="form-check-input" type="checkbox" name="active" id="accountActive{{ account.id if account else 'New' }}"{% if not account or account.active %} checked{% endif %}><label class="form-check-label" for="accountActive{{ account.id if account else 'New' }}">Activa</label></div><div class="form-check"><input class="form-check-input" type="checkbox" name="receives_rent" id="accountRent{{ account.id if account else 'New' }}"{% if account and account.receives_rent %} checked{% endif %}><label class="form-check-label" for="accountRent{{ account.id if account else 'New' }}">Recibe rentas</label></div><div class="form-check"><input class="form-check-input" type="checkbox" name="receives_settlements" id="accountSettlement{{ account.id if account else 'New' }}"{% if account and account.receives_settlements %} checked{% endif %}><label class="form-check-label" for="accountSettlement{{ account.id if account else 'New' }}">Recibe liquidaciones</label></div></div><div class="col-12"><button class="btn btn-primary">Guardar cuenta</button></div></div>
