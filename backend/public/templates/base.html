<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Habitaciones disponibles para alquiler mensual.{% endblock %}">
    {% block seo %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('public_static', path='public.css') }}?v=public-manual-dates-1">
</head>
<body>
    <header class="site-header">
        <div class="site-shell">
            <a class="site-brand" href="{{ url_for('public_catalog') }}" aria-label="{{ site_name }} — Habitaciones en Elche">
                <span class="site-wordmark"><strong>HSI</strong> <em>Rents</em></span>
                <span class="site-tagline">Habitaciones en Elche</span>
            </a>
            <nav class="site-nav" aria-label="Navegación principal">
                <a href="{{ url_for('public_catalog') }}#habitaciones">Todas las habitaciones</a>
                <a href="{{ url_for('public_catalog') }}#como-funciona">Cómo funciona</a>
                <a href="{{ header_contact_url or (url_for('public_catalog') ~ '#habitaciones') }}">Contacto</a>
                <a class="site-nav-whatsapp" href="{{ header_contact_url or (url_for('public_catalog') ~ '#habitaciones') }}" aria-label="Contacto por WhatsApp"><img src="{{ url_for('public_static', path='icons/whatsapp.svg') }}" alt="" width="22" height="22"></a>
            </nav>
        </div>
    </header>
    <main class="site-shell site-main">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
